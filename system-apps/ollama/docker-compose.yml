services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: appbay.ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
    networks:
      - appbay_shared

volumes:
  ollama-data:

networks:
  appbay_shared:
    external: true
