collection: [self-hosted, media]
tags:
  tier: personal
  role: media-server

upstream:
  source: ./docker-compose.yml
  expose:
    - jellyfin

traits:
  - type: ingress
    host: "jellyfin.${{project.DOMAIN}}"
    port: 8096
    service: jellyfin
    exposure: external
    tls:
      staging: false
