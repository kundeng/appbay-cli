name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Build CLI binaries for each target platform
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            bun-target: bun-linux-x64
            artifact: appbay-linux-x64
          - target: linux-arm64
            runner: ubuntu-latest
            bun-target: bun-linux-arm64
            artifact: appbay-linux-arm64
          - target: macos-x64
            runner: ubuntu-latest
            bun-target: bun-darwin-x64
            artifact: appbay-macos-x64
          - target: macos-arm64
            runner: macos-latest
            bun-target: bun-darwin-arm64
            artifact: appbay-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo build --filter=@appbay/core --filter=@appbay/db
        env:
          APPBAY_VERSION: ${{ github.ref_name }}

      # `--define` is required, not decorative. packages/core builds with plain
      # `tsc`, which strips types but cannot inline env vars, so
      # `process.env.APPBAY_VERSION` survives into dist/index.js as a RUNTIME
      # read and every shipped binary evaluated it on the user's machine, where
      # it is unset — reporting the `0.1.0-dev` fallback. Setting the env alone
      # (below) only reaches the tsc build, never the binary.
      - name: Compile CLI binary
        run: |
          cd apps/cli
          bun build --compile --target=${{ matrix.bun-target }} \
            --define 'process.env.APPBAY_VERSION="${{ github.ref_name }}"' \
            src/index.ts \
            --outfile dist/${{ matrix.artifact }}
        env:
          APPBAY_VERSION: ${{ github.ref_name }}

      - name: Smoke test (native targets only)
        if: matrix.target == 'linux-x64' || matrix.target == 'macos-arm64'
        run: |
          chmod +x apps/cli/dist/${{ matrix.artifact }}
          # ASSERT, don't just print. This step used to run `--version` and
          # discard the output, so a binary reporting the wrong version passed
          # the smoke test for four releases.
          ACTUAL="$(apps/cli/dist/${{ matrix.artifact }} --version)"
          echo "reported version: $ACTUAL"
          if [ "$ACTUAL" != "${{ github.ref_name }}" ]; then
            echo "::error::version mismatch — binary reports '$ACTUAL', tag is '${{ github.ref_name }}'"
            exit 1
          fi
          apps/cli/dist/${{ matrix.artifact }} --help | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/cli/dist/${{ matrix.artifact }}
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build and push Docker image for the web server
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APPBAY_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/appbay-server:latest
            ghcr.io/${{ github.repository_owner }}/appbay-server:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Appbay Server
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all binary artifacts
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cli, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: appbay-*

      - name: Make binaries executable and rename
        run: |
          chmod +x dist/appbay-linux-x64/appbay-linux-x64
          chmod +x dist/appbay-linux-arm64/appbay-linux-arm64
          chmod +x dist/appbay-macos-x64/appbay-macos-x64
          chmod +x dist/appbay-macos-arm64/appbay-macos-arm64

      # `curl … | sh` then executing an unverified 90MB download is the highest-trust
      # moment in the product — the user grants their machine before knowing anything
      # about it. Without a published digest there is no way for a user, for us, or for
      # a mirror to answer "is this the binary that was built?" (issue #73).
      #
      # Flat filenames, so `sha256sum -c` works from the directory the installer
      # downloads into. The artifacts arrive one-per-directory from download-artifact.
      - name: Generate SHA256SUMS
        run: |
          cd dist
          for a in appbay-linux-x64 appbay-linux-arm64 appbay-macos-x64 appbay-macos-arm64; do
            sha256sum "$a/$a" | sed "s|$a/||"
          done > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          # Prove it verifies before publishing it. A checksum file that does not validate
          # its own inputs is worse than none — it looks like a guarantee.
          for a in appbay-linux-x64 appbay-linux-arm64 appbay-macos-x64 appbay-macos-arm64; do
            cp "$a/$a" .
          done
          sha256sum -c SHA256SUMS

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          cat >> $GITHUB_OUTPUT << 'NOTES'
          BODY<<EOF
          ## Install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/scripts/install.sh | sh
          ```

          Or download a binary directly:

          | Platform | Binary |
          |---|---|
          | Linux x64 | `appbay-linux-x64` |
          | Linux arm64 | `appbay-linux-arm64` |
          | macOS x64 (Intel) | `appbay-macos-x64` |
          | macOS arm64 (Apple Silicon) | `appbay-macos-arm64` |

          Verify a manual download against the published digests:

          ```bash
          curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS
          sha256sum --ignore-missing -c SHA256SUMS
          ```

          ## Docker image

          ```bash
          docker pull ghcr.io/${{ github.repository_owner }}/appbay-server:${{ steps.version.outputs.VERSION }}
          ```

          ## Quick start

          ```bash
          appbay doctor          # check prerequisites
          appbay init            # scaffold ~/.appbay and seed system apps
          appbay server start    # start the control plane
          appbay list            # discover apps
          ```
          EOF
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Appbay ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.BODY }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/appbay-linux-x64/appbay-linux-x64
            dist/appbay-linux-arm64/appbay-linux-arm64
            dist/appbay-macos-x64/appbay-macos-x64
            dist/appbay-macos-arm64/appbay-macos-arm64
            dist/SHA256SUMS
