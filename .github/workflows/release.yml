name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Build CLI binaries for each target platform
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            bun-target: bun-linux-x64
            artifact: appbay-linux-x64
          - target: linux-arm64
            runner: ubuntu-latest
            bun-target: bun-linux-arm64
            artifact: appbay-linux-arm64
          - target: macos-x64
            runner: ubuntu-latest
            bun-target: bun-darwin-x64
            artifact: appbay-macos-x64
          - target: macos-arm64
            runner: macos-latest
            bun-target: bun-darwin-arm64
            artifact: appbay-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo build --filter=@appbay/core --filter=@appbay/db
        env:
          APPBAY_VERSION: ${{ github.ref_name }}

      # `--define` is required, not decorative. packages/core builds with plain
      # `tsc`, which strips types but cannot inline env vars, so
      # `process.env.APPBAY_VERSION` survives into dist/index.js as a RUNTIME
      # read and every shipped binary evaluated it on the user's machine, where
      # it is unset — reporting the `0.1.0-dev` fallback. Setting the env alone
      # (below) only reaches the tsc build, never the binary.
      - name: Compile CLI binary
        run: |
          cd apps/cli
          bun build --compile --target=${{ matrix.bun-target }} \
            --define 'process.env.APPBAY_VERSION="${{ github.ref_name }}"' \
            src/index.ts \
            --outfile dist/${{ matrix.artifact }}
        env:
          APPBAY_VERSION: ${{ github.ref_name }}

      # Only the two NATIVE targets can run on the machine that built them. The two
      # cross-compiled ones are smoke-tested in the `smoke` job below, under emulation.
      - name: Smoke test (native targets)
        if: matrix.target == 'linux-x64' || matrix.target == 'macos-arm64'
        run: |
          chmod +x apps/cli/dist/${{ matrix.artifact }}
          # ASSERT, don't just print. This step used to run `--version` and
          # discard the output, so a binary reporting the wrong version passed
          # the smoke test for four releases.
          ACTUAL="$(apps/cli/dist/${{ matrix.artifact }} --version)"
          echo "reported version: $ACTUAL"
          if [ "$ACTUAL" != "${{ github.ref_name }}" ]; then
            echo "::error::version mismatch — binary reports '$ACTUAL', tag is '${{ github.ref_name }}'"
            exit 1
          fi
          apps/cli/dist/${{ matrix.artifact }} --help | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/cli/dist/${{ matrix.artifact }}
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Smoke-test the two CROSS-COMPILED binaries under emulation (issue #72).
  #
  # `build-cli` can only execute the target it was built on, so for four releases
  # `appbay-linux-arm64` and `appbay-macos-x64` were compiled, uploaded, and handed
  # to users without ever being started once. That is backwards: the natively-built
  # pair got the check, and the cross-compiled pair — the case where a binary can
  # link cleanly and still fail to start — got none.
  #
  # This job gates the release. An artifact that cannot run does not ship.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke (${{ matrix.artifact }} under ${{ matrix.how }})
    needs: [build-cli]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: appbay-linux-arm64
            runner: ubuntu-latest
            how: qemu
          - artifact: appbay-macos-x64
            runner: macos-latest
            how: rosetta
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Enable qemu-user for aarch64
        if: matrix.how == 'qemu'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # The binary is DYNAMICALLY linked, so registering binfmt is not enough on its
      # own — bare `./appbay-linux-arm64` dies with
      # `Could not open '/lib/ld-linux-aarch64.so.1'`. It needs an aarch64 userland,
      # which an arm64 container supplies. Measured on an x86_64 host, 2026-08-16.
      - name: Run under qemu (arm64 userland)
        if: matrix.how == 'qemu'
        run: |
          chmod +x ${{ matrix.artifact }}
          docker run --rm --platform linux/arm64 -v "$PWD:/w" -w /w \
            docker.io/library/ubuntu:24.04 \
            /bin/sh -c './${{ matrix.artifact }} --version > /w/.ver && ./${{ matrix.artifact }} --help > /dev/null'
          ACTUAL="$(cat .ver)"
          echo "reported version: $ACTUAL"
          [ "$ACTUAL" = "${{ github.ref_name }}" ] || {
            echo "::error::version mismatch — ${{ matrix.artifact }} reports '$ACTUAL', tag is '${{ github.ref_name }}'"; exit 1; }

      # macos-latest is arm64, so an x86_64 Mach-O needs Rosetta 2. It is not
      # preinstalled on the arm64 runners.
      - name: Install Rosetta 2
        if: matrix.how == 'rosetta'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Run under Rosetta (x86_64)
        if: matrix.how == 'rosetta'
        run: |
          chmod +x ${{ matrix.artifact }}
          ACTUAL="$(arch -x86_64 ./${{ matrix.artifact }} --version)"
          echo "reported version: $ACTUAL"
          [ "$ACTUAL" = "${{ github.ref_name }}" ] || {
            echo "::error::version mismatch — ${{ matrix.artifact }} reports '$ACTUAL', tag is '${{ github.ref_name }}'"; exit 1; }
          arch -x86_64 ./${{ matrix.artifact }} --help > /dev/null

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all binary artifacts
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cli, smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: appbay-*

      - name: Make binaries executable and rename
        run: |
          chmod +x dist/appbay-linux-x64/appbay-linux-x64
          chmod +x dist/appbay-linux-arm64/appbay-linux-arm64
          chmod +x dist/appbay-macos-x64/appbay-macos-x64
          chmod +x dist/appbay-macos-arm64/appbay-macos-arm64

      # `curl … | sh` then executing an unverified 90MB download is the highest-trust
      # moment in the product — the user grants their machine before knowing anything
      # about it. Without a published digest there is no way for a user, for us, or for
      # a mirror to answer "is this the binary that was built?" (issue #73).
      #
      # Flat filenames, so `sha256sum -c` works from the directory the installer
      # downloads into. The artifacts arrive one-per-directory from download-artifact.
      - name: Generate SHA256SUMS
        run: |
          cd dist
          for a in appbay-linux-x64 appbay-linux-arm64 appbay-macos-x64 appbay-macos-arm64; do
            sha256sum "$a/$a" | sed "s|$a/||"
          done > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          # Prove it verifies before publishing it. A checksum file that does not validate
          # its own inputs is worse than none — it looks like a guarantee.
          #
          # Verify in a SCRATCH dir. download-artifact lays each artifact out as
          # dist/<name>/<name>, so copying the file up into dist/ collides with the
          # directory of the same name — `cp: cannot overwrite directory
          # './appbay-linux-x64' with non-directory`, which is exactly how this failed on
          # v0.0.1-alpha.5. The digests were correct; the check proving them was not.
          V="$(mktemp -d)"
          for a in appbay-linux-x64 appbay-linux-arm64 appbay-macos-x64 appbay-macos-arm64; do
            cp "$a/$a" "$V/$a"
          done
          cp SHA256SUMS "$V/"
          ( cd "$V" && sha256sum -c SHA256SUMS )

      # ⚠️ SIGNED PROVENANCE IS DEFERRED, DELIBERATELY (#73, last criterion).
      # SHA256SUMS answers "is this the file that was uploaded?" It does NOT answer "was
      # it built from this source, by this workflow?" — anyone who can write to the
      # release can replace the binary and the digest together. Closing that gap is
      # `actions/attest-build-provenance`, which needs `id-token: write` and is only
      # meaningful once consumers check it; `install.sh` has no verification step for an
      # attestation today, so adding one now would publish a signature nobody reads.
      # Not done, on purpose, and recorded here rather than left as an unstated gap.

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          cat >> $GITHUB_OUTPUT << 'NOTES'
          BODY<<EOF
          ## Install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/scripts/install.sh | sh
          ```

          Or download a binary directly:

          | Platform | Binary |
          |---|---|
          | Linux x64 | `appbay-linux-x64` |
          | Linux arm64 | `appbay-linux-arm64` |
          | macOS x64 (Intel) | `appbay-macos-x64` |
          | macOS arm64 (Apple Silicon) | `appbay-macos-arm64` |

          Verify a manual download against the published digests:

          ```bash
          curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS
          sha256sum --ignore-missing -c SHA256SUMS
          ```

          ## Docker image

          ```bash
          docker pull ghcr.io/${{ github.repository_owner }}/appbay-server:${{ steps.version.outputs.VERSION }}
          ```

          ## Quick start

          ```bash
          appbay doctor          # check prerequisites
          appbay init            # scaffold ~/.appbay and seed system apps
          appbay server start    # start the control plane
          appbay list            # discover apps
          ```
          EOF
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Appbay ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.BODY }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/appbay-linux-x64/appbay-linux-x64
            dist/appbay-linux-arm64/appbay-linux-arm64
            dist/appbay-macos-x64/appbay-macos-x64
            dist/appbay-macos-arm64/appbay-macos-arm64
            dist/SHA256SUMS
