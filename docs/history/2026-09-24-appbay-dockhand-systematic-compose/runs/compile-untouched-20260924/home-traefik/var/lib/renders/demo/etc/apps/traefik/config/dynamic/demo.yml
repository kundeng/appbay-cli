http:
  middlewares:
    demo-web-secure-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        customResponseHeaders:
          X-Robots-Tag: none,noindex,nofollow,noarchive,nosnippet,notranslate,noimageindex
          server: ""
        forceSTSHeader: true
        referrerPolicy: same-origin
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 63072000
  routers:
    demo-web-http-redirect:
      entryPoints:
        - web
      middlewares:
        - demo-web-secure-headers
      rule: Host(`demo.lab.example.com`)
      service: demo-web-service
    demo-web-router:
      entryPoints:
        - websecure
      middlewares:
        - demo-web-secure-headers
      rule: Host(`demo.lab.example.com`)
      service: demo-web-service
      tls:
        certResolver: letsencrypt
  services:
    demo-web-service:
      loadBalancer:
        servers:
          - url: http://demo_web:80
