key_evidence: "The hypothesis was that a failed auth trait still deploys. It does not. appbay up exits 1 with 'Failed: authgap \u2014 not deployed: its configuration did not compile \u2026 Deploying it would start a container that cannot serve its declared routes.' docker ps by label: no containers. No policy and no route file written. The per-app gate is deploy-service.ts:154-164 (appsWithCompileErrors -> refusalOf). Teardown removed the appbay_shared network; nothing left behind."
exit_code: 1
duration_s: 0
