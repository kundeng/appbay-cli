record: analysis-13-web-deploy-drops-the-edge-route
type: analysis
title: web-deploy-drops-the-edge-route
timestamp: 2026-09-24T11:52:51-04:00
claim: no web deploy path installs auxiliaryFiles, so an app deployed from the UI has no route and no auth policy
bears_on: [H1]
verdict: supports
key_evidence: auxiliaryFiles appears exactly once under apps/web/src — plans.ts:112, which maps it to paths for DISPLAY in the plan preview. No web deploy path writes it. deployments.up (4 UI call sites) compiles, writes only docker-compose.rendered.yml, and spawns docker compose up -d; the queue's deploy.ts worker does the same. fullDeploy, the one procedure whose docstring claims parity with appbay up, has 0 UI call sites. 16 hardcoded "docker" spawn sites in the web server versus the CLI's containerBin(appbayHome) resolver. The web also calls compile({activeApps}), an option the current core deliberately removed.
exit_code: 0
duration_s: 0
