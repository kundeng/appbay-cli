claim: where Dockhand goes further, named with the code that implements it
verdict: supports
key_evidence: "Multi-host: Dockhand parameterises every call by envId (2822 references, 255 files) over a docker HTTP API (dockerFetch at docker.ts:789) with four connection types; AppBay's spawn layer (containerExec/containerSpawn/containerCompose) takes no host and route delivery is a local write, join(appbayHome, aux.path) at deploy/route.ts:35,45. Multi-user: Dockhand has users/sessions/roles/userRoles with env-scoped roles, LDAP, OIDC, apiTokens, auditLogs and a central authorize() gate (RBAC enterprise-gated, 5 isEnterprise checks); AppBay delegates identity to the edge with three operations (edge users list/create/reset-password). GUI: 700 files / 129,226 lines over 21 pages and 266 API routes, versus AppBay web's 136 files / 25,550 lines over 9 pages. Dockhand also leads on backups (37 restic modules vs AppBay's metadata-only trait), 10 scheduled tasks, git-driven deploys, vulnerability scanning, notifications and a remote agent. One section failed: a malformed path made the edge-users help line error; captured separately."
