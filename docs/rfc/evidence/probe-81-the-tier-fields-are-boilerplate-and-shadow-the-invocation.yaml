  text: |
    tree: bd32116 v0.0.1-alpha.11

    == surface 1 — COMPOSE's environment:, inside appbay.yaml via free-form fragments ==
      appbay-yaml.ts:70:export const OverrideSchema = z.record(z.any());
      appbay-yaml.ts:93:  services: z.record(z.any()),
      appbay-yaml.ts:370:  overrides: z.record(OverrideSchema).optional(),
      appbay-yaml.ts:391:  services: z.record(ServiceTraitsSchema).optional(),
      ⇒ overrides and overlays[].services are free-form compose, so a compose 'environment:'
        key legitimately appears in appbay.yaml. Cannot be renamed; it is Compose's spec.
      occurrences of an indented environment: in appbay.yaml — ours 0, upstream 93

    == surface 2 — appbay's SCOPE NAME in ${{environment.KEY}} ==
      scope-resolver.ts:50:const VALID_SCOPES = ["service", "environment", "project"] as const;
      manifests actually using it — ours 0, upstream 0

    == surface 3 — the top-level tier FIELDS in appbay.yaml ==
      appbay-yaml.ts:19:  project: z.string().default("default"),
      appbay-yaml.ts:20:  environment: z.string().default("default"),
      appbay-yaml.ts:361:  project: z.string().default("default"),
      appbay-yaml.ts:362:  environment: z.string().default("default"),
      every distinct value across both catalogs:
         150 environment: default
         150 project: default

    == who wins, the manifest or the invocation? ==
      compile.ts:  const config = app.appbayConfig;
      compile.ts:  const appProject = config?.project ?? defaultProject;
      compile.ts:  const appEnvironment = config?.environment ?? defaultEnvironment;
      compile.ts:  const sharedNetworks = config?.shared_network ?? ["appbay_shared"];
      and the field is a Zod .default(), so after parsing it is NEVER undefined:
      appbay-yaml.ts:20:  environment: z.string().default("default"),
      appbay-yaml.ts:362:  environment: z.string().default("default"),
      ⇒ config?.environment ?? defaultEnvironment can only ever yield config.environment
        whenever an appbay.yaml exists. The value passed to compile() is unreachable.
