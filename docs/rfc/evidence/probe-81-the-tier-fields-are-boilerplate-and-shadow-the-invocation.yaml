record: probe-81-the-tier-fields-are-boilerplate-and-shadow-the-invocation
type: probe
title: the-tier-fields-are-boilerplate-and-shadow-the-invocation
timestamp: "2026-08-30T23:14:14-04:00"
claim: renaming the environment scope means touching every manifest that declares an environment
verdict: 'refutes'
key_evidence: 'the rename is free where it matters and the fields should be deleted, not renamed. Three surfaces: (1) Compose own environment: key, legitimately inside appbay.yaml because overrides (appbay-yaml.ts:370) and overlays services (:93) are free-form compose records — 93 occurrences in upstream manifests, and it CANNOT be renamed because it is Compose spec; (2) the scope name in the reference syntax — ZERO usages across both catalogs, so renaming it costs nothing today; (3) the top-level project:/environment: fields, present in 150 manifests and every single one reads "default" — zero information carried. AND A LIVE DEFECT: compile.ts:380-381 is config?.project ?? defaultProject, but the fields are Zod .default("default") so after parsing they are never undefined. The project and environment passed INTO compile() are therefore unreachable whenever an appbay.yaml exists, which is always. A future --environment flag would be silently ignored by every one of those 150 manifests'
exit_code: 0
duration_s: 1
command: bash investigations/2026-08-30-preprod02-sim-stack-review/src/preprod02-sim-stack-review/environment_word_surfaces_and_precedence.sh
