record: probe-75-only-the-home-pointer-must-live-outside-appbay-home
type: probe
title: only-the-home-pointer-must-live-outside-appbay-home
timestamp: "2026-08-30T22:44:26-04:00"
claim: all of /etc/appbay/config can move inside $APPBAY_HOME, as RFC-001 2.1 would need
verdict: 'refutes'
key_evidence: 'only one of the four fields must stay outside. readSystemConfig() has exactly two non-test callers, appbay-home.ts:101 and :147, and BOTH take .home and nothing else — owner and serviceUser are written and never read by any command, and writeSystemConfig() has zero non-test callers because init-system writes the file with sh -c mkdir+tee at init-system.ts:523. .home is the pointer TO $APPBAY_HOME, so it cannot live inside it; owner, service_user and the proposed secrets_backend are properties of the tree, read after it is located, and move cleanly to $APPBAY_HOME/etc/system. A non-root pointer already exists at ~/.config/appbay/home (tier 3), so /etc/appbay/config shrinks to a one-line pointer or disappears'
exit_code: 0
duration_s: 0
command: bash investigations/2026-08-30-preprod02-sim-stack-review/src/preprod02-sim-stack-review/system_config_fields_split.sh
code:
  - path: investigations/2026-08-30-preprod02-sim-stack-review/src/preprod02-sim-stack-review/system_config_fields_split.sh
