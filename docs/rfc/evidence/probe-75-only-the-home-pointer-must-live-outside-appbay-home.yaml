  text: |
    tree: bd32116 v0.0.1-alpha.11
    note: nothing below touches the OS. /etc/appbay is never opened.

    == what the file holds ==
      export interface SystemConfig {
        /** Who owns the appbay tree. */
        owner: OwnerModel;
        /** Service account name (only when owner === "service"). */
        serviceUser?: string;
        /** The resolved APPBAY_HOME path. */
        home: string;
      }

    == who reads it, and for what ==
      apps/cli/src/utils/appbay-home.ts:101:      value: readSystemConfig()?.home ?? null,
      apps/cli/src/utils/appbay-home.ts:147:  const system = readSystemConfig();

    == the four-tier home resolution — the reason one field cannot move ==
      3:  if (process.env.APPBAY_HOME) return process.env.APPBAY_HOME;
      8:  const system = readSystemConfig();
      11:  const saved = readSavedAppbayHome();
      14:  return join(homedir(), ".appbay");
      apps/cli/src/utils/appbay-home.ts:22:export const CONFIG_FILE = join(CONFIG_DIR, "home");
      apps/cli/src/utils/system-config.ts:24:export const SYSTEM_CONFIG_FILE = join(SYSTEM_CONFIG_DIR, "config");

    == is there already a NON-ROOT pointer outside $APPBAY_HOME? ==
      appbay-home.ts:21:export const CONFIG_DIR = join(homedir(), ".config", "appbay");
      appbay-home.ts:43:  writeFileSync(CONFIG_FILE, homePath + "\n", "utf-8");
      ⇒ yes: ~/.config/appbay/home, tier 3, written by 'appbay init', needs no root.

    == verdict per field ==
      FIELD          MOVABLE   WHY
      home           NO        it is the pointer TO $APPBAY_HOME; inside it, it is circular
      owner          YES       a property of the tree, read after the tree is located
      service_user   YES       same
      secrets_backend YES       RFC 2.1 proposes it; it decides how var/lib/secrets is read
