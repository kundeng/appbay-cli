type: probe
title: discovery-and-self-declaration-are-two-jobs-in-one-file
timestamp: "2026-08-30T22:47:40-04:00"
claim: this project depends on /etc/appbay/config, so the system payload cannot move into APPBAY_HOME
verdict: 'refutes'
key_evidence: 'llm-stack has ZERO init-system calls and never reads /etc/appbay/config: every appbay invocation is wrapped with an explicit APPBAY_HOME env (provision-appbay.yml:120,639,656; verify-payload.yml:39; verify-stack.yml:42) and provision-substrate.yml:662 exports it from the systemd unit, so this project is tier 1 only and tier 2 is dead weight. Spec 25 decision 3 lets ansible write exactly two things outside APPBAY_HOME — the binary and the catalog source — and the system config is neither. Separately, a moved or copied tree is UNDETECTABLE today: looksScaffolded is existsSync(path/etc) and nothing compares the resolved path to any path recorded inside the tree (0 matches). Renders survive a move because compile.ts:395 writes a relative path back to appsDir, but init.ts:131-132 already documents the copied-home hazard for the runtime socket gid'
exit_code: 0
duration_s: 1
command: bash investigations/2026-08-30-preprod02-sim-stack-review/src/preprod02-sim-stack-review/home_pointer_vs_self_declaration.sh
