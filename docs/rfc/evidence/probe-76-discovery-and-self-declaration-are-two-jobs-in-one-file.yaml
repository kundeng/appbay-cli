    == 2. the two things ansible is allowed to write outside $APPBAY_HOME ==
          _appbay_release_tag: "{{ appbay_release_tag | default('v0.0.1-alpha.6') }}"
          _appbay_release_base: >-
            https://github.com/{{ _appbay_release_repo }}/releases/download/{{ _appbay_release_tag }}
          # Our catalog source on the CONTROL NODE. Staged to the host at `_appbay_catalog_dest`,
          # which is OUTSIDE $APPBAY_HOME — one of exactly two things Ansible may write directly
          # (spec 25 decision 3): the binary, and the catalog source. appbay copies or symlinks it
          # into var/lib/catalog/bundled itself; we never reach in there.
          appbay_catalog_src: "{{ playbook_dir }}/catalog"
          # The checked-in catalog plus fetched server repos are assembled here on the control
          # node, then pushed to the host as one catalog. This keeps each nested repo the owner
          # of its app while eliminating multiple rsync writers over one staged tree.

