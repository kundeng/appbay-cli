output:
  text: "== the rule, as the repo states it ==\n   * \U0001F6A8 THIS EXISTS BECAUSE ARGV IS WORLD-READABLE. A value passed as\n   * `appbay secrets set KEY <value>` appears in /proc/<pid>/cmdline, which on a default\n   * Linux system any local user can read for the lifetime of the process. That is fine\n   * for a human typing a throwaway value into their own shell; it is NOT fine for a\n   * configuration-management run seeding real credentials onto a shared host, which is\n   * exactly what this command is for.\n  at secrets.ts:359: * \U0001F6A8 THIS EXISTS BECAUSE ARGV IS WORLD-READABLE. A value passed as\n\n== how these commands reach a shell ==\n  packages/core/src/secrets/providers/keepass.ts:24:import { exec } from \"node:child_process\";\n  packages/core/src/secrets/providers/keepass.ts:27:const execAsync = promisify(exec);\n  packages/core/src/services/vault-service.ts:23:import { exec } from \"node:child_process\";\n  packages/core/src/services/vault-service.ts:28:const execAsync = promisify(exec);\n  ⇒ child_process.exec spawns /bin/sh -c <string>, so the whole string is that process's argv.\n\n== every site that puts a secret in that string ==\n  secrets/providers/keepass.ts:151:  const cmd = `echo '${escapedPassword}' | keepassxc-cli show --quiet --attributes '${field}'${keyFileArg} '${dbPath}' '${entryPath}'`;\n  services/vault-service.ts:452:  const cmd = `echo '${escapedPassword}' | keepassxc-cli ${escapedArgs}`;\n  services/vault-service.ts:513:  const cmd = `echo '${escapedPassword}' | keepassxc-cli db-create --set-password '${escapedPath}'`;\n  services/vault-service.ts:565:    const cmd = `echo '${escapedPassword}' | keepassxc-cli edit --password '${escapedValue}' '${escapedDbPath}' '${escapedEntry}'`;\n  services/vault-service.ts:570:      const mkdirCmd = `echo '${escapedPassword}' | keepassxc-cli mkdir '${escapedDbPath}' '${scope.replace(/'/g, \"'\\\\''\")}'`;\n  services/vault-service.ts:578:    const cmd = `printf '%s\\\\n%s' '${escapedPassword}' '${escapedValue}' | keepassxc-cli add --password-prompt '${escapedDbPath}' '${escapedEntry}'`;\n\n== which of them leak the STORED SECRET VALUE, not just the master password ==\n  vault-service.ts:550:  const escapedValue = value.replace(/'/g, \"'\\\\''\");\n  vault-service.ts:565:    const cmd = `echo '${escapedPassword}' | keepassxc-cli edit --password '${escapedValue}' '${escapedDbPath}' '${escapedEntry}'`;\n  vault-service.ts:578:    const cmd = `printf '%s\\\\n%s' '${escapedPassword}' '${escapedValue}' | keepassxc-cli add --password-prompt '${escapedDbPath}' '${escapedEntry}'`;\n\n== the KDF salt is a compile-time constant ==\n  vault.ts:41:const SCRYPT_SALT = \"appbay-vault-v1\";\n  vault.ts:43:const SCRYPT_COST = 16384;\n  vault.ts:51:  return scryptSync(password, SCRYPT_SALT, SCRYPT_KEYLEN, {\n  vault.ts:52:    N: SCRYPT_COST,\n  ⇒ same master password on two hosts derives the same AES key. The vault file\n    format is IV(12)+tag(16)+ciphertext with no header, so there is nowhere to\n    put a per-vault salt without a format version:\n  vault.ts:191:  // File format: 12 bytes IV + 16 bytes auth tag + rest is ciphertext\n  vault.ts:223:  // File format: IV (12) + auth tag (16) + ciphertext\n\n== is any of this reachable from our stack today? ==\n  keepass:// refs in ansible/llm-stack/catalog: 0\n  but the manifest schema accepts the backend as a provider name:\n  appbay-yaml.ts:212:  provider: z.enum([\"vault\", \"keepass\", \"file\", \"env\", \"sops\"]).default(\"vault\"),\n"
