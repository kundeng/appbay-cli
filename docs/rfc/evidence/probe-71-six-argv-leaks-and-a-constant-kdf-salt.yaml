record: probe-71-six-argv-leaks-and-a-constant-kdf-salt
type: probe
title: six-argv-leaks-and-a-constant-kdf-salt
timestamp: "2026-08-30T22:31:08-04:00"
claim: the argv exposure is one line in keepass.ts, and the vault KDF derives a per-host key
verdict: 'refutes'
key_evidence: 'six sites, not one: keepass.ts:151 plus vault-service.ts:452, :513, :565, :570, :578, all through promisify(exec) which is /bin/sh -c. Two of them — :565 and :578 — put the STORED SECRET VALUE in the argv as well as the master password, so writing a credential through the keepass backend exposes that credential, not just the key to the store. The repo states the rule against exactly this at secrets.ts:359 and breaks it six times. Separately the KDF salt is the compile-time constant ''appbay-vault-v1'' (vault.ts:41), so the derived AES key depends only on the password — and the file format, IV+tag+ciphertext with no header (vault.ts:191), has nowhere to put a per-vault salt without a version byte'
exit_code: 0
duration_s: 0
command: bash investigations/2026-08-30-preprod02-sim-stack-review/src/preprod02-sim-stack-review/secret_in_argv_census.sh
