record: probe-74-edge-password-is-a-portal-local-account-and-the-idp-path-is-dead-code
type: probe
title: edge-password-is-a-portal-local-account-and-the-idp-path-is-dead-code
timestamp: "2026-08-30T22:43:26-04:00"
claim: the edge user password is a federated/SSO credential, so appbay is storing something it should not hold
verdict: 'refutes'
key_evidence: 'it is a portal-LOCAL account, not a federated one. The shipped Caddyfile (system-apps.ts:110) declares one identity store — ''local identity store appbay_local { realm local; path /etc/caddy/security/users.json }'' — and appbay writes bcrypt cost-10 hashes into that same users.json, so it is Caddy Security''s own store rather than a second copy of an account held elsewhere. A no-password-stored path DOES exist in the type system: EdgeIdentityProvider is local|ldap|oidc, and ldap/oidc store only bindPasswordRef / clientSecretRef, both routed through the normal vault:// path. But it is DEAD CODE — renderEdgeSecurityBlock and edgeSecretEnvMapping have 0 callers and 0 tests across the whole repo, and the live Caddyfile hardcodes local-only with no provider selection. So today appbay is local-identity-only in practice'
exit_code: 0
duration_s: 2
command: bash investigations/2026-08-30-preprod02-sim-stack-review/src/preprod02-sim-stack-review/edge_identity_is_local_only.sh
