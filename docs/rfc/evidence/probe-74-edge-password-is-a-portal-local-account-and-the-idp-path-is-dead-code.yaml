nd node_modules ==\n  ./packages/core/src/services/edge-portal-config.ts:84:export function renderEdgeSecurityBlock(config: EdgeIdentityConfig): string {\n  ./packages/core/src/services/edge-portal-config.ts:119:export function edgeSecretEnvMapping(config: EdgeIdentityConfig): Array<{ envVar: string; ref: string }> {\n  callers (definition line excluded): 0\n  tests naming it: 0\n\n== and the interface those comments say also mutates identities ==\n  apps/ contains: cli \n  packages/core/src/services/deploy-service.ts:652:  // leaves execution to the scheduler/job queue in apps/web. On a CLI-only installation\n"
