key_evidence: 'it is small and migrates nothing. Five surfaces: the two field declarations (appbay-yaml.ts:19-20, :361-362), the pair-keyed sites in compile.ts (:370-371, :380-381, :446-447, :555-556, :976), the generated-values key (generated-values.ts:72, :131 and state.ts:27-28, :75-76), the resolver vocabulary (scope-resolver.ts:20-22, :50), and the identity fields that a namespace WOULD have to enter but does not today (upstream-transform.ts:153 container_name, :260 network, ingress.ts:147/:161 aux filename). Data to migrate: NONE — generated-values.yaml on the sim is "values: []", and all 150 manifests read default/default, so collapsing them is a text edit with no live values behind it. The key change is one word: z.string().default("default") becomes z.string().optional(), which is exactly what makes ABSENCE expressible and makes the existing ?? at compile.ts:380-381 correct as written. Also found: ScopeSchema already carries collection and tags beside project/environment — k8s labels and selectors sitting next to the namespace idea'
