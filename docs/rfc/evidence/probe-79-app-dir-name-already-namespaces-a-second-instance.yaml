record: probe-79-app-dir-name-already-namespaces-a-second-instance
type: probe
title: app-dir-name-already-namespaces-a-second-instance
timestamp: "2026-08-30T23:01:45-04:00"
claim: deploying the same code twice with different env needs a new appbay concept, not just a second app directory
verdict: 'refutes'
key_evidence: 'the app DIRECTORY NAME already namespaces almost everything. Two copies of one catalog entry under different names compile to non-colliding container names (appbay.litellm-sim.litellm vs appbay.litellm-prod.litellm), internal networks (litellm-sim_internal vs litellm-prod_internal) and volumes (litellm-sim_litellm-db vs litellm-prod_litellm-db); the aux Caddy file is <appName>.caddy so it separates too. appbay_shared is the one shared name and it is shared BY DESIGN — it is the edge network both attach to, not a collision. THE ONE THING THAT DOES NOT SEPARATE IS THE HOSTNAME: ingress.ts:68 takes props.host as a literal from appbay.yaml, and our entry declares host: litellm.${{project.DOMAIN}} — one DOMAIN per APPBAY_HOME, so two instances in one home claim the same host. NOTE: the two auth-trait compile errors are a sandbox artifact, the temp home had no project.yaml declaring ingress_provider caddy, not a finding about instancing'
exit_code: 0
duration_s: 1
