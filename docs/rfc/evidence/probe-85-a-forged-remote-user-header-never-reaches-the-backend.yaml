record: probe-85-a-forged-remote-user-header-never-reaches-the-backend
type: probe
title: a-forged-remote-user-header-never-reaches-the-backend
timestamp: "2026-08-31T10:50:00-04:00"
claim: the web UI can trust the Remote-User header Caddy Security injects (RFC-001 §1, owner decision 2026-08-31)
verdict: 'supports'
key_evidence: 'Run against the pinned edge image with the generated control-plane fragments in
  place and a header-echoing backend behind them: a request carrying `Remote-User: attacker-admin`
  and no session gets 302 to the portal and the backend NEVER SEES IT — confirmed against a
  control that reaches the same backend directly on the shared network and does echo the header.
  So an unauthenticated party cannot forge identity through the edge, which is the property
  header-trust depends on. NOT PROVEN and deliberately not depended upon: whether Caddy
  overwrites Remote-User for an ALREADY-authenticated user. The full portal login is a two-step
  sandbox flow with Secure cookies and was not completed in the probe. It is moot for
  authorization anyway — the generated policy admits `allow roles authp/admin` only, so every
  principal that reaches the control plane is an admin and one spoofing another gains no
  privilege. The server therefore uses Remote-User for ATTRIBUTION and derives authorization
  from having passed the edge, so the unproven property has no security impact by construction.'
exit_code: 0
duration_s: 180
command: >-
  docker run -d --name hdr-echo --network hdrprobe --network-alias appbay_server node:22-alpine node /echo.js;
  docker run -d --name hdr-caddy --network hdrprobe -p 8899:80 localhost/appbay-caddy-security:2.11.4-v1.1.64;
  curl -s -H 'Host: appbay.localtest.me' -H 'Remote-User: attacker-admin' http://127.0.0.1:8899/
output_kind: text
output:
  text: |
    tree: d402bc9 (public) / matching private
    image: localhost/appbay-caddy-security:2.11.4-v1.1.64  (the pinned edge image)
    fragments: generated by services/control-plane-edge.ts, unmodified

    == TEST 1 — unauthenticated request WITH a forged Remote-User ==
      $ curl -H 'Host: appbay.localtest.me' -H 'Remote-User: attacker-admin' http://127.0.0.1:8899/
        HTTP status: 302
        reached the backend? no  — the echo backend never answered
        body: Found

    == CONTROL — the same backend, reached directly on the shared network ==
      $ docker run --rm --network hdrprobe curlimages/curl \
          -H 'Remote-User: direct' http://appbay_server:3000/
        {
         "host": "appbay_server:3000",
         "remote-user": "direct"      <- it DOES echo the header when reached
        }

    ⇒ The 302 is not the backend declining to echo. The request never arrived.

    == what this does and does not license ==
      LICENSED: trusting Remote-User for requests that arrive through the edge, because an
        unauthenticated party cannot produce one.
      NOT LICENSED: exposing the backend port while trusting the header. The control above IS
        the bypass — anything that can reach appbay_server:3000 sets its own identity. This is
        why `appbay server start` binds to 127.0.0.1 whenever it wrote an edge route, and why
        the server must refuse to serve when it is not behind the edge rather than serve open.

    == the question left open, and why it does not matter ==
      Whether Caddy overwrites Remote-User for an already-authenticated user was not tested:
      the portal login is a two-step sandbox flow (username -> /auth/sandbox/<id> -> secret)
      with Secure cookies, and completing it needed more scaffolding than the answer was worth.

      It is moot for authorization. The generated policy is:

          allow roles authp/admin

      so every principal that reaches the control plane is already an admin. One admin
      spoofing another's name gains no privilege — it is an attribution concern only. The
      server uses Remote-User for display and derives authorization from having passed the
      edge at all, so this stays true even if Caddy's injection were additive.
