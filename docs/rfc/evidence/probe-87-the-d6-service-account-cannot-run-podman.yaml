record: probe-87-the-d6-service-account-cannot-run-podman
type: probe
title: the-d6-service-account-cannot-run-podman
timestamp: "2026-08-31T11:38:00-04:00"
claim: "`appbay init-system --owner service` sets a host up to run the control plane"
verdict: 'refutes'
key_evidence: 'On Fedora 43 with podman only, the D-6 service account `init-system` creates by
  default cannot run podman at all, so the control plane cannot start as it. Two independent
  causes, both direct consequences of how the account is created: `useradd --system
  --no-create-home` leaves $HOME at a /home/appbay that does not exist, and rootless podman
  refuses with `cannot resolve /home/appbay: lstat ... no such file or directory`; and no
  subuid/subgid ranges are allocated (`grep -c appbay /etc/subuid` = 0), so even with HOME set
  podman refuses with `no subuid ranges found for user "appbay"`. NOT a systemd problem —
  running `appbay server start` by hand as that account fails the same way
  (`EACCES: permission denied, posix_spawn ''podman''`). The same host runs the stack fine as an
  ordinary user. Docker hosts are likely unaffected: init-system adds the service account to
  the `docker` group, and there is no equivalent for rootful podman, whose socket is
  root-owned.'
exit_code: 1
duration_s: 90
command: >-
  sudo -u appbay env APPBAY_HOME=/var/lib/appbay appbay server start;
  sudo -u appbay podman info;
  sudo -u appbay env HOME=/var/lib/appbay podman info;
  grep -c appbay /etc/subuid /etc/subgid
output_kind: text
output:
  text: |
    host: appbay-rhel (multipass), Fedora Linux 43 Cloud, systemd 258, podman only (no docker)
    binary: appbay 0.1.0-dev
    account: appbay:x:950:991::/home/appbay:/usr/sbin/nologin   (created by init-system, D-6)

    == 1. the control plane, started by systemd, as the service account ==
      $ sudo systemctl start appbay-server.service
      journal:
        appbay[10819]: cannot resolve /home/appbay: lstat /home/appbay: no such file or directory
        appbay-server.service: Failed with result 'exit-code'.

    == 2. the same thing by hand — so it is not systemd ==
      $ sudo -u appbay env APPBAY_HOME=/var/lib/appbay appbay server start
        Starting Appbay server...
        Failed to start server (exit 1):
          EACCES: permission denied, posix_spawn 'podman'

    == 3. why: podman itself, as that account ==
      $ sudo -u appbay podman info
        cannot resolve /home/appbay: lstat /home/appbay: no such file or directory

      $ sudo -u appbay env HOME=/var/lib/appbay podman info
        level=error msg="cannot find UID/GID for user appbay: no subuid ranges found for
                         user \"appbay\" in /etc/subuid - check rootless mode in man pages."
        Error: setting up the process

      $ grep -c appbay /etc/subuid /etc/subgid
        /etc/subuid:0
        /etc/subgid:0

    ⇒ Two independent blockers, both created by the account itself:
        --no-create-home   -> $HOME does not exist, rootless podman needs it
        no subuid ranges   -> rootless podman cannot map users at all

    == what still works ==
      - The unit is well-formed: `systemd-analyze verify` exits 0, and it correctly ordered
        after `podman.socket` rather than a `podman.service` that does not exist.
      - It runs ExecStart and reports failure legibly in the journal, naming the cause.
      - The same host runs the stack fine as an ordinary user.
      - `appbay home` from /tmp as an ordinary user resolves /var/lib/appbay via tier 2 —
        the property probe-86 showed a systemd unit cannot provide.

    ⇒ SCOPE: this is not a defect in the unit, and not caused by it. `init-system` enables the
      ROOTFUL podman socket deliberately (its own comment says the control plane needs it), but
      nothing gives the service account access to that root-owned socket — the docker path has
      the `docker` group, and rootful podman has no equivalent. Deciding between "give the
      account subuid + a home", "grant it the rootful socket", and "run the unit as root" is a
      real design choice about the D-6 model, not a bug fix.
