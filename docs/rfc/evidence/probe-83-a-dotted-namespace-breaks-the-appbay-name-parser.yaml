          if (nameResult.status === 0) {
            for (const line of (nameResult.stdout as string).trim().split("\n").filter(Boolean)) {
              // "appbay.ollama" → "ollama", "appbay.caddy" → "caddy"
              const match = line.trim().match(/^appbay\.([^.]+)/);
              if (match) apps.add(match[1]!);

