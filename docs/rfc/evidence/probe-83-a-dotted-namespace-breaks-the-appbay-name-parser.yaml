record: probe-83-a-dotted-namespace-breaks-the-appbay-name-parser
type: probe
title: a-dotted-namespace-breaks-the-appbay-name-parser
timestamp: "2026-08-30T23:31:27-04:00"
claim: a dot-delimited namespace drops cleanly into container names, which are already dot-delimited
verdict: 'supports'
key_evidence: 'the dot is safe in container names and filenames but must be normalised for DNS. Exactly ONE parser reads appbay.* names: docker.ts:72, /^appbay\.([^.]+)/, which takes the first segment — against appbay.uom.sim.litellm.litellm it extracts "uom", not "litellm", so every when: clause would fail and overlays would silently deactivate. That parser has to become namespace-aware regardless of delimiter, otherwise when:[litellm] would be satisfied by ANOTHER namespace litellm, so it is a requirement of namespacing rather than a cost of the dot. builds.ts:285 reconstructs the same name and needs the same treatment. THE ONE REAL DOT HAZARD is the shared-network alias: upstream-transform.ts:167 builds alias = appName_serviceName and that string is the DNS name other apps dial (ingress.ts:70, :195). A dotted namespace makes it uom.sim_litellm_litellm, where the dot is a DNS LABEL SEPARATOR, not a character — two labels, not one name. Normalise the dot to a hyphen wherever the namespace enters a DNS-bearing string; container names, aux filenames and volume prefixes can keep it'
exit_code: 0
duration_s: 1
command: bash investigations/2026-08-30-preprod02-sim-stack-review/src/preprod02-sim-stack-review/dot_delimited_namespace_collisions.sh
